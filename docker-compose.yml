services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL to your public HTTPS origin}
      APP_PASSWORD: ${APP_PASSWORD:?Set a private owner password of at least 16 characters}
      DATA_DIR: /app/data
      PORT: 3000
    expose:
      - "3000"
    volumes:
      - coffee-data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.coffee-app.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN}`)"
      - "traefik.http.routers.coffee-app.entrypoints=websecure"
      - "traefik.http.routers.coffee-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.coffee-app.loadbalancer.server.port=3000"
volumes:
  coffee-data:
