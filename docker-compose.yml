version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coffee-tracker
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/prod.db
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - MCP_TOKEN=${MCP_TOKEN:-coffee-tracker-mcp-token}
    volumes:
      - coffee-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.coffee-app.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.coffee-app.entrypoints=websecure"
      - "traefik.http.routers.coffee-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.coffee-app.loadbalancer.server.port=3000"

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: coffee-tracker-mcp
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/prod.db
      - MCP_PORT=3001
      - MCP_TOKEN=${MCP_TOKEN:-coffee-tracker-mcp-token}
    volumes:
      - coffee-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.coffee-mcp.rule=Host(`${MCP_DOMAIN}`)"
      - "traefik.http.routers.coffee-mcp.entrypoints=websecure"
      - "traefik.http.routers.coffee-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.coffee-mcp.loadbalancer.server.port=3001"

volumes:
  coffee-data:
    driver: local
